name: Provision authorized enrollment

on:
  workflow_dispatch:
    inputs:
      enrollment_id:
        description: Authorized enrollment UUID from the isolated Supabase environment
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    name: Provision authorized enrollment (homologation)
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision enrollment
        env:
          MESA_OS_ENROLLMENT_ID: ${{ inputs.enrollment_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/provision-authorized-enrollment.mjs
