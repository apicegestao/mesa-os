[build]
  command = "pnpm build"
  publish = ".next"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src package.json pnpm-lock.yaml next.config.ts tsconfig.json eslint.config.mjs netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.16.0"

[context.production.environment]
  NEXT_PUBLIC_APP_ENV = "production"
  NEXT_PUBLIC_SITE_URL = "https://mesa-os.netlify.app"

[context.deploy-preview.environment]
  NEXT_PUBLIC_APP_ENV = "staging"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
